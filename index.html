<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FedEx Tracking</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Leaflet CSS & JS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Turf.js for smooth curved route -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fedexPurple: '#4D148C',
            fedexOrange: '#FF6600',
            fedexBg: '#F4F4F7',
            fedexGreen: '#008A00',
            fedexGreenBg: '#E6F4E6',
            fedexHeaderPurple: '#330066',
          }
        }
      }
    }
  </script>
  <style>
    .leaflet-control-attribution { display: none !important; }
  </style>
</head>
<body class="bg-fedexBg text-gray-800 font-sans pb-20">

  <!-- TOP APP HEADER -->
  <header class="bg-white px-4 py-3 flex justify-between items-center border-b sticky top-0 z-30">
    <div class="flex items-center space-x-3">
      <button class="text-gray-700 text-lg"><i class="fa-solid fa-bars"></i></button>
      <div class="text-2xl font-black tracking-tighter text-fedexPurple">
        <span>Fed</span><span class="text-fedexOrange">Ex</span><span class="text-xs align-super text-fedexOrange">®</span>
      </div>
    </div>
    <div class="flex items-center space-x-4 text-gray-700 text-lg">
      <i class="fa-solid fa-globe"></i>
      <i class="fa-regular fa-user"></i>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- SEARCH INPUT BAR -->
    <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-2">
      <input type="text" id="searchInput" placeholder="Enter Tracking Number..." class="w-full text-sm outline-none px-2 font-semibold text-gray-700" />
      <button onclick="performTrack()" class="bg-fedexHeaderPurple hover:bg-purple-950 text-white font-bold text-xs px-5 py-2.5 rounded-lg transition">Track</button>
    </div>

    <!-- LOADING STATE -->
    <div id="loadingState" class="hidden bg-white rounded-2xl p-8 text-center text-gray-500">
      <i class="fa-solid fa-spinner fa-spin text-2xl text-fedexPurple mb-3"></i>
      <div class="text-sm font-medium">Looking up shipment...</div>
    </div>

    <!-- ERROR STATE -->
    <div id="errorState" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-2xl p-5 text-center text-sm">
      <i class="fa-solid fa-circle-exclamation mb-2 text-lg"></i>
      <div id="errorMessage">No shipment found for this tracking number.</div>
    </div>

    <!-- MAIN TRACKING CARD (hidden until data loads) -->
    <div id="trackingContent" class="hidden space-y-4">

      <!-- MAIN TRACKING CARD -->
      <div class="bg-fedexHeaderPurple text-white rounded-2xl p-5 shadow-lg space-y-5">
        
        <!-- TOP TRACKING # & SHARE -->
        <div class="flex justify-between items-start">
          <div>
            <div class="text-[10px] font-bold tracking-widest text-purple-200 uppercase">TRACKING #</div>
            <div id="displayTrackingNum" class="text-2xl font-black tracking-wider mt-0.5">—</div>
          </div>
          <button onclick="copyTracking()" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 border border-white/20">
            <i class="fa-solid fa-share-nodes"></i> Share
          </button>
        </div>

        <!-- STATUS BADGES -->
        <div class="space-y-1">
          <div class="flex items-center space-x-2">
            <span id="displayStatusBadge" class="bg-fedexGreenBg text-fedexGreen text-[11px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">—</span>
            <span id="displayStatusSubtitle" class="text-sm font-semibold text-white">—</span>
          </div>
          <div class="text-xs text-purple-200 pt-1">Estimated delivery</div>
          <div class="flex items-baseline space-x-2">
            <span id="displayEstimatedDelivery" class="text-xl font-bold text-green-400">—</span>
            <span id="displayOnTime" class="text-xs text-purple-200 font-medium">On time</span>
          </div>
        </div>

        <!-- STEP PROGRESS BAR -->
        <div class="pt-2">
          <div class="relative flex items-center justify-between">
            <div class="absolute top-1/2 left-4 right-4 -translate-y-1/2 h-1 bg-purple-900 z-0"></div>
            <div id="progressActiveLine" class="absolute top-1/2 left-4 -translate-y-1/2 h-1 bg-fedexGreen transition-all duration-500 z-0" style="width: 0%;"></div>

            <div class="relative z-10 flex flex-col items-center">
              <div id="stepIcon1" class="w-8 h-8 rounded-full bg-purple-900 text-purple-300 flex items-center justify-center text-xs border border-purple-700">
                <i class="fa-solid fa-box"></i>
              </div>
              <span class="text-[10px] font-semibold text-purple-200 mt-1.5">Picked up</span>
            </div>

            <div class="relative z-10 flex flex-col items-center">
              <div id="stepIcon2" class="w-8 h-8 rounded-full bg-purple-900 text-purple-300 flex items-center justify-center text-xs border border-purple-700">
                <i class="fa-solid fa-truck"></i>
              </div>
              <span class="text-[10px] font-semibold text-purple-200 mt-1.5">In transit</span>
            </div>

            <div class="relative z-10 flex flex-col items-center">
              <div id="stepIcon3" class="w-8 h-8 rounded-full bg-purple-900 text-purple-300 flex items-center justify-center text-xs border border-purple-700">
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <span class="text-[10px] font-semibold text-purple-300 mt-1.5">Out for delivery</span>
            </div>

            <div class="relative z-10 flex flex-col items-center">
              <div id="stepIcon4" class="w-8 h-8 rounded-full bg-purple-900 text-purple-300 flex items-center justify-center text-xs border border-purple-700">
                <i class="fa-solid fa-check"></i>
              </div>
              <span class="text-[10px] font-semibold text-purple-300 mt-1.5">Delivered</span>
            </div>
          </div>
        </div>
      </div>

      <!-- FROM / TO CARD -->
      <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm grid grid-cols-2 gap-2 relative">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-gray-100 border rounded-full w-7 h-7 flex items-center justify-center text-gray-500 text-xs">
          <i class="fa-solid fa-arrow-right"></i>
        </div>
        <div>
          <div class="text-[10px] font-bold text-gray-400 uppercase">FROM</div>
          <div id="displayFromCity" class="text-xs font-bold text-gray-900 mt-0.5">—</div>
          <div id="displayFromCountry" class="text-[11px] text-gray-500">United States</div>
        </div>
        <div class="pl-4">
          <div class="text-[10px] font-bold text-gray-400 uppercase">TO</div>
          <div id="displayToCity" class="text-xs font-bold text-gray-900 mt-0.5">—</div>
          <div id="displayToCountry" class="text-[11px] text-gray-500">United States</div>
        </div>
      </div>

      <!-- MAP -->
      <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm relative">
        <div id="map" class="w-full h-56 z-10"></div>
      </div>

      <!-- SHIPMENT SPECS -->
      <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm grid grid-cols-3 gap-3 text-xs">
        <div>
          <div class="text-[9px] font-bold text-gray-400 uppercase">SERVICE</div>
          <div id="displayService" class="font-bold text-gray-800 mt-0.5">—</div>
        </div>
        <div>
          <div class="text-[9px] font-bold text-gray-400 uppercase">WEIGHT</div>
          <div id="displayWeight" class="font-bold text-gray-800 mt-0.5">—</div>
        </div>
        <div>
          <div class="text-[9px] font-bold text-gray-400 uppercase">SHIP DATE</div>
          <div id="displayShipDate" class="font-bold text-gray-800 mt-0.5">—</div>
        </div>
      </div>

      <!-- TRAVEL HISTORY -->
      <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <span class="text-xs font-bold text-gray-900 uppercase">TRAVEL HISTORY</span>
        </div>
        <div id="travelHistoryList" class="space-y-4 pt-1">
          <!-- Events injected via JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t py-2 px-6 flex justify-between items-center z-30 text-center text-xs font-medium text-gray-500">
    <div class="text-fedexPurple font-bold flex flex-col items-center">
      <i class="fa-solid fa-location-arrow text-base mb-0.5"></i>
      <span>Track</span>
    </div>
    <div class="flex flex-col items-center hover:text-fedexPurple">
      <i class="fa-solid fa-box text-base mb-0.5"></i>
      <span>Ship</span>
    </div>
    <div class="flex flex-col items-center hover:text-fedexPurple">
      <i class="fa-solid fa-location-dot text-base mb-0.5"></i>
      <span>Locations</span>
    </div>
    <div class="flex flex-col items-center hover:text-fedexPurple">
      <i class="fa-solid fa-circle-question text-base mb-0.5"></i>
      <span>Support</span>
    </div>
    <div class="flex flex-col items-center hover:text-fedexPurple">
      <i class="fa-regular fa-circle-user text-base mb-0.5"></i>
      <span>Account</span>
    </div>
  </nav>

  <script>
    // ============================================================
    // YOUR REAL SUPABASE CREDENTIALS
    // ============================================================
    const SUPABASE_URL = 'https://oyaeazydvudevjbwtwtt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vl_XazGVbpvyobavVnPqUg_VfqGGZ5B';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let map;
    let currentTrackingNumber = '';

    // City coordinates for the map
    const CITY_COORDS = {
      'los angeles': [34.0522, -118.2437],
      'new york': [40.7128, -74.0060],
      'memphis': [35.1495, -90.0490],
      'indianapolis': [39.7684, -86.1581],
      'chicago': [41.8781, -87.6298],
      'dallas': [32.7767, -96.7970],
      'atlanta': [33.7490, -84.3880],
      'denver': [39.7392, -104.9903],
      'seattle': [47.6062, -122.3321],
      'miami': [25.7617, -80.1918],
      'houston': [29.7604, -95.3698],
      'phoenix': [33.4484, -112.0740],
      'boston': [42.3601, -71.0589],
      'san francisco': [37.7749, -122.4194],
      'las vegas': [36.1699, -115.1398],
      'detroit': [42.3314, -83.0458],
      'philadelphia': [39.9526, -75.1652],
      'charlotte': [35.2271, -80.8431],
      'portland': [45.5152, -122.6784]
    };

    // ============================================================
    // INIT
    // ============================================================
    window.addEventListener('DOMContentLoaded', () => {
      initMap();

      // Support both ?code= and ?tn=
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code') || urlParams.get('tn') || urlParams.get('tracking');
      
      if (code) {
        document.getElementById('searchInput').value = code;
        fetchTrackingData(code);
      }
    });

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 18
      }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function getCoords(cityName) {
      if (!cityName) return [39.8283, -98.5795];
      const key = cityName.toLowerCase().split(',')[0].trim();
      for (const city in CITY_COORDS) {
        if (key.includes(city) || city.includes(key)) {
          return CITY_COORDS[city];
        }
      }
      return [35.1495, -90.0490]; // default Memphis hub
    }

    function formatTrackingDisplay(num) {
      const clean = (num || '').replace(/\s+/g, '');
      if (clean.length === 12) {
        return clean.replace(/(\d{4})(\d{4})(\d{4})/, '$1 $2 $3');
      }
      return num;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr; // already formatted text
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function formatDateTime(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit', hour12: true
      });
    }

    function formatTimeOnly(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return '';
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    // ============================================================
    // TRACK BUTTON
    // ============================================================
    function performTrack() {
      const code = document.getElementById('searchInput').value.trim();
      if (code) fetchTrackingData(code);
    }

    // Allow Enter key
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performTrack();
    });

    // ============================================================
    // MAIN FETCH FROM DATABASE
    // ============================================================
    async function fetchTrackingData(trackingNum) {
      const clean = trackingNum.replace(/\s+/g, '');
      currentTrackingNumber = clean;

      // UI states
      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('errorState').classList.add('hidden');
      document.getElementById('trackingContent').classList.add('hidden');

      try {
        // Try both with and without spaces
        let { data: shipment, error } = await supabaseClient
          .from('shipments')
          .select('*')
          .or(`tracking_number.eq.${clean},tracking_number.eq.${formatTrackingDisplay(clean)}`)
          .maybeSingle();

        if (error) throw error;

        if (!shipment) {
          showError('No shipment found for tracking number: ' + formatTrackingDisplay(clean));
          return;
        }

        // Fetch travel history
        const { data: events } = await supabaseClient
          .from('tracking_events')
          .select('*')
          .eq('shipment_id', shipment.id)
          .order('event_time', { ascending: false });

        renderShipment(shipment, events || []);

      } catch (err) {
        console.error(err);
        showError('Error loading shipment. Please try again.');
      }
    }

    function showError(msg) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorMessage').textContent = msg;
      document.getElementById('errorState').classList.remove('hidden');
    }

    // ============================================================
    // RENDER REAL DATA
    // ============================================================
    function renderShipment(s, events) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('trackingContent').classList.remove('hidden');

      // Tracking number
      document.getElementById('displayTrackingNum').textContent = formatTrackingDisplay(s.tracking_number);

      // Status
      const status = s.status || 'Pending';
      document.getElementById('displayStatusBadge').textContent = status.toUpperCase();
      
      const subtitleMap = {
        'Pending': 'Shipment information received',
        'Picked Up': 'Package picked up',
        'Processing': 'Processing at facility',
        'In Transit': 'On the way to delivery',
        'Arrived at Facility': 'Arrived at local facility',
        'Out for Delivery': 'Out for delivery today',
        'Delivered': 'Package delivered successfully',
        'Exception': 'Delivery exception'
      };
      document.getElementById('displayStatusSubtitle').textContent = subtitleMap[status] || 'On the way to delivery';

      // Estimated delivery – prefer real column, then text field
      const eta = s.estimated_delivery || s.expected_delivery_text || s.eta || null;
      document.getElementById('displayEstimatedDelivery').textContent = eta ? formatDate(eta) : '—';
      
      if (status === 'Delivered') {
        document.getElementById('displayOnTime').textContent = 'Delivered';
        document.getElementById('displayOnTime').className = 'text-xs text-green-300 font-medium';
      } else {
        document.getElementById('displayOnTime').textContent = 'On time';
        document.getElementById('displayOnTime').className = 'text-xs text-purple-200 font-medium';
      }

      // From / To
      const fromCity = s.sender_city || '';
      const fromState = s.sender_state || '';
      const fromZip = s.sender_zip || '';
      document.getElementById('displayFromCity').textContent = 
        `${fromCity}${fromState ? ', ' + fromState : ''}${fromZip ? ' ' + fromZip : ''}`.trim() || '—';
      document.getElementById('displayFromCountry').textContent = s.sender_country || 'United States';

      const toCity = s.recipient_city || '';
      const toState = s.recipient_state || '';
      const toZip = s.recipient_zip || '';
      document.getElementById('displayToCity').textContent = 
        `${toCity}${toState ? ', ' + toState : ''}${toZip ? ' ' + toZip : ''}`.trim() || '—';
      document.getElementById('displayToCountry').textContent = s.recipient_country || 'United States';

      // Specs
      document.getElementById('displayService').textContent = s.service_type || '—';
      
      if (s.weight_lbs) {
        document.getElementById('displayWeight').textContent = 
          `${s.weight_lbs} lbs / ${(s.weight_lbs * 0.453592).toFixed(2)} kg`;
      } else if (s.weight_display) {
        document.getElementById('displayWeight').textContent = s.weight_display;
      } else {
        document.getElementById('displayWeight').textContent = '—';
      }

      document.getElementById('displayShipDate').textContent = 
        formatDate(s.ship_date || s.ship_date_text || s.created_at);

      // Progress bar
      updateProgressBar(status);

      // Map
      const currentLoc = s.current_location || s.sender_city || 'Memphis';
      renderCurvedRoute(s.sender_city, s.recipient_city, currentLoc);

      // Travel history
      renderEvents(events, s);
    }

    // ============================================================
    // PROGRESS BAR
    // ============================================================
    function updateProgressBar(status) {
      const s1 = document.getElementById('stepIcon1');
      const s2 = document.getElementById('stepIcon2');
      const s3 = document.getElementById('stepIcon3');
      const s4 = document.getElementById('stepIcon4');
      const line = document.getElementById('progressActiveLine');

      const green = "w-8 h-8 rounded-full bg-fedexGreen text-white flex items-center justify-center text-xs shadow-md";
      const inactive = "w-8 h-8 rounded-full bg-purple-900 text-purple-300 flex items-center justify-center text-xs border border-purple-700";
      const current = "w-8 h-8 rounded-full bg-fedexGreen text-white flex items-center justify-center text-xs shadow-md ring-4 ring-fedexHeaderPurple";

      // Reset
      s1.className = inactive;
      s2.className = inactive;
      s3.className = inactive;
      s4.className = inactive;
      line.style.width = '0%';

      const normalized = (status || '').toLowerCase();

      if (normalized.includes('delivered')) {
        s1.className = green; s2.className = green; s3.className = green; s4.className = green;
        line.style.width = '100%';
      } else if (normalized.includes('out for delivery')) {
        s1.className = green; s2.className = green; s3.className = current; s4.className = inactive;
        line.style.width = '66%';
      } else if (normalized.includes('transit') || normalized.includes('facility') || normalized.includes('processing')) {
        s1.className = green; s2.className = current; s3.className = inactive; s4.className = inactive;
        line.style.width = '33%';
      } else if (normalized.includes('picked') || normalized.includes('pending')) {
        s1.className = current; s2.className = inactive; s3.className = inactive; s4.className = inactive;
        line.style.width = '0%';
      }
    }

    // ============================================================
    // MAP WITH CURVED ROUTE
    // ============================================================
    function renderCurvedRoute(fromCity, toCity, currentCity) {
      const start = getCoords(fromCity);
      const end = getCoords(toCity);
      const current = getCoords(currentCity);

      // Clear previous layers
      map.eachLayer((layer) => {
        if (layer instanceof L.Marker || layer instanceof L.Polyline || layer instanceof L.GeoJSON) {
          map.removeLayer(layer);
        }
      });

      // Curved route
      try {
        const line = turf.lineString([
          [start[1], start[0]],
          [current[1], current[0]],
          [end[1], end[0]]
        ]);
        const curved = turf.bezierSpline(line);

        L.geoJSON(curved, {
          style: { color: '#4D148C', weight: 4, opacity: 0.85 }
        }).addTo(map);
      } catch (e) {
        // fallback straight line
        L.polyline([start, current, end], {
          color: '#4D148C', weight: 4, opacity: 0.85
        }).addTo(map);
      }

      // Origin & Destination pins
      const pinIcon = L.divIcon({
        html: `<div style="color:#4D148C;font-size:20px;"><i class="fa-solid fa-location-dot"></i></div>`,
        className: '',
        iconSize: [20, 20],
        iconAnchor: [10, 20]
      });

      L.marker(start, { icon: pinIcon }).addTo(map)
        .bindPopup(`<b>Origin</b><br>${fromCity || 'Origin'}`);
      L.marker(end, { icon: pinIcon }).addTo(map)
        .bindPopup(`<b>Destination</b><br>${toCity || 'Destination'}`);

      // Current truck marker
      const truckIcon = L.divIcon({
        html: `
          <div style="background:#4D148C;color:white;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);">
            <i class="fa-solid fa-truck" style="font-size:14px;"></i>
          </div>`,
        className: '',
        iconSize: [34, 34],
        iconAnchor: [17, 17]
      });

      L.marker(current, { icon: truckIcon }).addTo(map)
        .bindPopup(`<b>Current Location</b><br>${currentCity || 'In transit'}`)
        .openPopup();

      map.fitBounds([start, end], { padding: [40, 40] });
    }

    // ============================================================
    // TRAVEL HISTORY
    // ============================================================
    function renderEvents(events, shipment) {
      const container = document.getElementById('travelHistoryList');
      container.innerHTML = '';

      if (!events || events.length === 0) {
        // Show at least the current status
        container.innerHTML = `
          <div class="flex items-start space-x-3 text-xs">
            <div class="w-24 text-gray-500 font-medium shrink-0">
              <div>${formatDate(shipment.updated_at || shipment.created_at)}</div>
              <div class="text-[10px] text-gray-400">${formatTimeOnly(shipment.updated_at || shipment.created_at)}</div>
            </div>
            <div class="w-3.5 h-3.5 rounded-full bg-fedexGreen ring-4 ring-green-100 shrink-0 mt-0.5"></div>
            <div>
              <div class="font-bold text-gray-800">${shipment.status || 'Pending'}</div>
              <div class="text-gray-600">Shipment registered</div>
              <div class="text-gray-400 font-semibold text-[10px]">${shipment.current_location || shipment.sender_city || ''}</div>
            </div>
          </div>
        `;
        return;
      }

      events.forEach((ev, idx) => {
        const dateStr = formatDate(ev.event_time);
        const timeStr = formatTimeOnly(ev.event_time);

        const item = document.createElement('div');
        item.className = 'flex items-start space-x-3 text-xs';
        item.innerHTML = `
          <div class="w-24 text-gray-500 font-medium shrink-0">
            <div>${dateStr}</div>
            <div class="text-[10px] text-gray-400">${timeStr}</div>
          </div>
          <div class="relative flex flex-col items-center">
            <div class="w-3.5 h-3.5 rounded-full ${idx === 0 ? 'bg-fedexGreen ring-4 ring-green-100' : 'bg-gray-300'}"></div>
            ${idx !== events.length - 1 ? '<div class="w-0.5 h-10 bg-gray-200"></div>' : ''}
          </div>
          <div class="flex-1 pb-2">
            <div class="font-bold text-gray-800">${ev.status}</div>
            <div class="text-gray-600">${ev.description || ''}</div>
            <div class="text-gray-400 font-semibold text-[10px] mt-0.5">${ev.location || ''}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // ============================================================
    // SHARE / COPY
    // ============================================================
    function copyTracking() {
      const num = document.getElementById('displayTrackingNum').textContent;
      navigator.clipboard.writeText(num).then(() => {
        alert('Tracking number copied: ' + num);
      });
    }
  </script>
</body>
</html>
